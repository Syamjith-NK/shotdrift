name: Publish to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Syamjith-NK/shotdrift' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as f:
              version = tomllib.load(f)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Release tag must match package version'
          PY
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install build twine pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -m pip check
      - run: pytest -q
      - run: python validate_real.py --controls-only
      - name: Verify packaged source includes runnable tests and demos
        run: |
          mkdir source-check
          tar -xzf dist/*.tar.gz -C source-check
          cd source-check/shotdrift-*
          test -f make_demo.py
          test -f validate_real.py
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shotdrift/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
