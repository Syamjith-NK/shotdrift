name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install '.[test]'
      - run: python -m pip check
      - run: pytest -q
      - run: python validate_real.py --controls-only
      - name: Build and verify the file demo
        run: |
          python make_demo.py
          python - <<'PY'
          import json, subprocess
          for move, code in [('pan-right', 0), ('push-in', 1)]:
              r = subprocess.run(['shotdrift', 'pan_demo.mp4', '--expect', move, '--json'], capture_output=True, text=True)
              assert r.returncode == code, (r.returncode, r.stdout, r.stderr)
              result = json.loads(r.stdout)['clips'][0]
              assert result['coverage']['complete']
          PY
